server:
  port: ${PORT:8080}
spring:
  application:
    name: progress-tracker
  datasource:
    url: jdbc:postgresql:${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
app:
  timezone: UTC
  default-users:
    admin:
      username: ${ADMIN_USERNAME:demo}
      email: ${ADMIN_EMAIL:demo@gmail.com}
      password: ${ADMIN_PASSWORD:1234}
      first-name: ${ADMIN_FIRST_NAME:demo}
      last-name: ${ADMIN_LAST_NAME:user}
      enabled: true
    user:
      username: ${USER_USERNAME:riya}
      email: ${USER_EMAIL:riya@gmail.com}
      password: ${USER_PASSWORD:1234}
      first-name: ${USER_FIRST_NAME:Riya}
      last-name: ${USER_LAST_NAME:Jadhav}
      enabled: true
