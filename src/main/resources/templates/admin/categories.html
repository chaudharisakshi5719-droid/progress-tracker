<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Category Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .admin-card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid px-4 py-4">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-tags-fill text-success me-2"></i> Category Management</h2>
                <p class="text-muted">Create new categories, edit colors/descriptions, or delete unused categories.</p>
            </div>
            <a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Admin Dashboard</a>
        </div>

        <div class="row g-4">
            <!-- Create Category Card -->
            <div class="col-lg-4">
                <div class="card admin-card p-4">
                    <h5 class="fw-bold mb-3 border-bottom pb-2"><i class="bi bi-plus-circle me-2 text-success"></i> Add New Category</h5>
                    <form th:action="@{/admin/categories/new}" th:object="${categoryDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="e.g. Meditation" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="2" placeholder="Short summary..."></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Badge Color</label>
                            <input type="color" class="form-control form-control-color w-100" th:field="*{color}" value="#0d6efd">
                        </div>
                        <button type="submit" class="btn btn-success fw-bold w-100"><i class="bi bi-plus-lg me-1"></i> Save Category</button>
                    </form>
                </div>
            </div>

            <!-- Categories List Table -->
            <div class="col-lg-8">
                <div class="card admin-card shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Color & Name</th>
                                        <th>Description</th>
                                        <th>Active Tasks</th>
                                        <th class="text-end pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categories}">
                                        <td th:text="${cat.id}">1</td>
                                        <td>
                                            <span class="badge rounded-pill text-white px-3 py-2" 
                                                  th:style="'background-color: ' + ${cat.color}" 
                                                  th:text="${cat.name}">Name</span>
                                        </td>
                                        <td th:text="${cat.description}">Description</td>
                                        <td><span class="badge bg-secondary" th:text="${cat.taskCount}">0</span></td>
                                        <td class="text-end pe-4">
                                            <div class="d-inline-flex gap-1">
                                                <!-- Delete Form -->
                                                <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post" 
                                                      onsubmit="return confirm('Are you sure you want to delete this category?');">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger" 
                                                            th:disabled="${cat.taskCount > 0}" 
                                                            th:title="${cat.taskCount > 0 ? 'Cannot delete category in use' : 'Delete category'}">
                                                        <i class="bi bi-trash"></i> Delete
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
