<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - System Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .admin-card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid px-4 py-4">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-list-check text-warning me-2"></i> System Tasks List</h2>
                <p class="text-muted">Inspect all user tasks created across the platform.</p>
            </div>
            <a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Admin Dashboard</a>
        </div>

        <div class="card admin-card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Task ID</th>
                                <th>Owner</th>
                                <th>Category</th>
                                <th>Title</th>
                                <th>Dates</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="task : ${taskPage.content}">
                                <td th:text="${task.id}">1</td>
                                <td class="fw-bold" th:text="${task.user.username}">username</td>
                                <td>
                                    <span class="badge rounded-pill text-white px-2 py-1" 
                                          th:style="'background-color: ' + ${task.category.color}" 
                                          th:text="${task.category.name}">Category</span>
                                </td>
                                <td>
                                    <strong th:text="${task.title}">Title</strong>
                                    <small th:if="${task.description}" class="text-muted d-block text-truncate" style="max-width: 250px;" th:text="${task.description}">Desc</small>
                                </td>
                                <td>
                                    <small class="text-muted" th:text="${task.startDate + ' to ' + task.endDate}">Dates</small>
                                </td>
                                <td>
                                    <span th:if="${task.active}" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2 py-1">Active</span>
                                    <span th:if="${!task.active}" class="badge bg-secondary bg-opacity-10 text-secondary border px-2 py-1">Inactive</span>
                                </td>
                                <td class="text-end pe-4">
                                    <form th:action="@{/admin/tasks/{id}/delete(id=${task.id})}" method="post" class="d-inline" 
                                          onsubmit="return confirm('Admin: Are you sure you want to delete this task?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash me-1"></i> Delete Task
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${taskPage.totalPages > 1}">
                <div class="small text-muted">
                    Page <span th:text="${taskPage.number + 1}">1</span> of <span th:text="${taskPage.totalPages}">1</span>
                </div>
                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${taskPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/tasks(page=${taskPage.number - 1}, size=${taskPage.size})}">Previous</a>
                        </li>
                        <li class="page-item" th:classappend="${taskPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/tasks(page=${taskPage.number + 1}, size=${taskPage.size})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
