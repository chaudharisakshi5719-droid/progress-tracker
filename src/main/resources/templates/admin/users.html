<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .admin-card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid px-4 py-4">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-people-fill text-primary me-2"></i> User Management</h2>
                <p class="text-muted">Manage system users, activate/deactivate accounts, and inspect activity.</p>
            </div>
            <a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Admin Dashboard</a>
        </div>

        <div class="card admin-card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Name</th>
                                <th>Role(s)</th>
                                <th>Tasks</th>
                                <th>Status</th>
                                <th>Joined</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${userPage.content}">
                                <td th:text="${user.id}">1</td>
                                <td class="fw-bold" th:text="${user.username}">username</td>
                                <td th:text="${user.email}">email@example.com</td>
                                <td th:text="${user.firstName + ' ' + user.lastName}">Name</td>
                                <td>
                                    <span th:each="role : ${user.roles}" 
                                          th:class="'badge me-1 ' + ${role.name() == 'ROLE_ADMIN' ? 'bg-danger' : 'bg-primary'}" 
                                          th:text="${role.name()}">ROLE_USER</span>
                                </td>
                                <td><span class="badge bg-secondary" th:text="${user.totalTasks}">0</span></td>
                                <td>
                                    <span th:if="${user.enabled}" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2 py-1">Active</span>
                                    <span th:if="${!user.enabled}" class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-2 py-1">Deactivated</span>
                                </td>
                                <td>
                                    <small class="text-muted" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">2026-10-01</small>
                                </td>
                                <td class="text-end pe-4">
                                    <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post" class="d-inline">
                                        <button type="submit" 
                                                th:class="'btn btn-sm ' + ${user.enabled ? 'btn-outline-danger' : 'btn-outline-success'}"
                                                th:text="${user.enabled ? 'Deactivate' : 'Activate'}">Toggle</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${userPage.totalPages > 1}">
                <div class="small text-muted">
                    Page <span th:text="${userPage.number + 1}">1</span> of <span th:text="${userPage.totalPages}">1</span>
                </div>
                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${userPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/users(page=${userPage.number - 1}, size=${userPage.size})}">Previous</a>
                        </li>
                        <li class="page-item" th:classappend="${userPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/users(page=${userPage.number + 1}, size=${userPage.size})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
