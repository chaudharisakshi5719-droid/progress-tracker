<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ProgressTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(0,0,0,0.3);
            background: #ffffff;
        }
        .brand-icon {
            font-size: 3rem;
            color: #ffc107;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card card-login p-4">
                    <div class="card-body text-center">
                        <i class="bi bi-fire brand-icon mb-2"></i>
                        <h3 class="fw-bold mb-1">ProgressTracker</h3>
                        <p class="text-muted mb-4 small">Track your habits, maintain streaks & analyze progress</p>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/login}" method="post">
                            <div class="form-floating mb-3 text-start">
                                <input type="text" class="form-control" id="username" name="username" placeholder="Username or Email" required autofocus>
                                <label for="username"><i class="bi bi-person me-1"></i> Username or Email</label>
                            </div>

                            <div class="form-floating mb-4 text-start">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                                <label for="password"><i class="bi bi-lock me-1"></i> Password</label>
                            </div>

                            <button class="btn btn-warning w-100 py-2 fw-bold text-dark shadow-sm" type="submit">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                            </button>
                        </form>

                        <div class="mt-4 pt-3 border-top text-center text-muted small">
                            Don't have an account? <a href="/register" class="fw-bold text-decoration-none">Sign Up</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
