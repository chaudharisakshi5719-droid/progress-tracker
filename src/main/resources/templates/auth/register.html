<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ProgressTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-register {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(0,0,0,0.3);
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-register p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="bi bi-fire text-warning fs-1"></i>
                            <h3 class="fw-bold">Create an Account</h3>
                            <p class="text-muted small">Join ProgressTracker to build habits and track goals</p>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/register}" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small fw-bold">First Name</label>
                                    <input type="text" class="form-control" name="firstName" th:value="${firstName}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small fw-bold">Last Name</label>
                                    <input type="text" class="form-control" name="lastName" th:value="${lastName}" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold">Username</label>
                                <input type="text" class="form-control" name="username" th:value="${username}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold">Email Address</label>
                                <input type="email" class="form-control" name="email" th:value="${email}" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold">Password</label>
                                <input type="password" class="form-control" name="password" required minlength="6">
                            </div>

                            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark shadow-sm">
                                <i class="bi bi-person-plus me-1"></i> Create Account
                            </button>
                        </form>

                        <div class="mt-4 text-center text-muted small border-top pt-3">
                            Already have an account? <a href="/login" class="fw-bold text-decoration-none">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
