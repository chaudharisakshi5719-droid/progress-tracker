<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - ProgressTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .category-card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
            transition: transform 0.2s ease;
        }
        .category-card:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-tags text-warning me-2"></i> Task Categories</h2>
                <p class="text-muted">Explore categories to organize your tasks and daily habits.</p>
            </div>
        </div>

        <div class="row g-3">
            <div th:each="cat : ${categories}" class="col-md-6 col-lg-3">
                <div class="card category-card p-3 h-100 border-start border-4" th:style="'border-color: ' + ${cat.color} + ' !important;'">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge rounded-pill px-3 py-2 text-white" th:style="'background-color: ' + ${cat.color}" th:text="${cat.name}">Category</span>
                        <span class="badge bg-light text-dark border" th:text="${cat.taskCount + ' Tasks'}">0 Tasks</span>
                    </div>
                    <p class="text-muted small mb-3" th:text="${cat.description}">Description</p>
                    <div class="mt-auto">
                        <a th:href="@{/tasks(categoryId=${cat.id})}" class="btn btn-outline-dark btn-sm w-100">View Tasks</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
