<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="text-center p-4">
        <i class="bi bi-shield-lock text-danger" style="font-size: 5rem;"></i>
        <h1 class="display-4 fw-bold mt-2">403 - Access Denied</h1>
        <p class="lead text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'You do not have permission to access this task or administrative page.'}">Forbidden</p>
        <a href="/dashboard" class="btn btn-primary fw-bold px-4 py-2"><i class="bi bi-house-door me-1"></i> Return to Dashboard</a>
    </div>
</body>
</html>
