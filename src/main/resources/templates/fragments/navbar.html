<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center fw-bold text-gradient" href="/dashboard">
                <i class="bi bi-fire text-warning me-2 fs-4"></i> ProgressTracker
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item" sec:authorize="hasRole('ROLE_USER')">
                        <a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ROLE_USER')">
                        <a class="nav-link" href="/tasks"><i class="bi bi-check2-square me-1"></i> My Tasks</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ROLE_USER')">
                        <a class="nav-link" href="/categories"><i class="bi bi-tags me-1"></i> Categories</a>
                    </li>
                    <!-- Admin Navigation -->
                    <li class="nav-item dropdown" sec:authorize="hasRole('ROLE_ADMIN')">
                        <a class="nav-link dropdown-toggle text-warning font-weight-bold" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-shield-lock-fill me-1"></i> Admin Portal
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark shadow">
                            <li><a class="dropdown-item" href="/admin/dashboard"><i class="bi bi-graph-up me-2"></i> Admin Overview</a></li>
                            <li><a class="dropdown-item" href="/admin/users"><i class="bi bi-people me-2"></i> User Management</a></li>
                            <li><a class="dropdown-item" href="/admin/tasks"><i class="bi bi-list-check me-2"></i> System Tasks</a></li>
                            <li><a class="dropdown-item" href="/admin/categories"><i class="bi bi-tags me-2"></i> Manage Categories</a></li>
                        </ul>
                    </li>
                </ul>

                <ul class="navbar-nav mb-2 mb-lg-0 align-items-lg-center">
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle active d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-5 me-2 text-info"></i>
                            <span sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark shadow">
                            <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i> Profile & Password</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline">
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-outline-light me-2 btn-sm" href="/login">Login</a>
                        <a class="btn btn-warning btn-sm" href="/register">Sign Up</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
