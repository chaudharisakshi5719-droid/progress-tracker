<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - ProgressTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .profile-card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="mb-4">
            <h2 class="fw-bold mb-1"><i class="bi bi-person-circle text-warning me-2"></i> User Profile</h2>
            <p class="text-muted">Manage your personal details and account security settings.</p>
        </div>

        <div class="row g-4">
            <!-- Profile Info Form -->
            <div class="col-md-6">
                <div class="card profile-card p-4">
                    <h5 class="fw-bold mb-3 border-bottom pb-2"><i class="bi bi-pencil-square me-2 text-primary"></i> Edit Personal Details</h5>
                    <form th:action="@{/profile}" th:object="${profileDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Username</label>
                            <input type="text" class="form-control bg-light" th:field="*{username}" readonly>
                            <small class="text-muted">Username cannot be changed.</small>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">First Name</label>
                                <input type="text" class="form-control" th:field="*{firstName}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Last Name</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Email Address</label>
                            <input type="email" class="form-control" th:field="*{email}" required>
                        </div>
                        <button type="submit" class="btn btn-primary fw-bold"><i class="bi bi-save me-1"></i> Update Profile</button>
                    </form>
                </div>
            </div>

            <!-- Change Password Form -->
            <div class="col-md-6">
                <div class="card profile-card p-4">
                    <h5 class="fw-bold mb-3 border-bottom pb-2"><i class="bi bi-shield-lock me-2 text-danger"></i> Change Password</h5>
                    <form th:action="@{/profile/password}" th:object="${passwordDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Current Password</label>
                            <input type="password" class="form-control" th:field="*{currentPassword}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">New Password</label>
                            <input type="password" class="form-control" th:field="*{newPassword}" required minlength="6">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Confirm New Password</label>
                            <input type="password" class="form-control" th:field="*{confirmPassword}" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-warning fw-bold text-dark"><i class="bi bi-key me-1"></i> Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
