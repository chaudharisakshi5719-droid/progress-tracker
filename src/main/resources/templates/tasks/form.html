<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - ProgressTracker'">Task Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .form-card {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card form-card p-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                            <h3 class="fw-bold mb-0" th:text="${pageTitle}">Create Task</h3>
                            <a href="/tasks" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Tasks</a>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="${taskRequest.id != null} ? @{/tasks/{id}/edit(id=${taskRequest.id})} : @{/tasks/new}" 
                              th:object="${taskRequest}" method="post">

                            <input type="hidden" th:field="*{id}">

                            <!-- Category Selection -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Category <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{categoryId}" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                                    <option value="">Select Category...</option>
                                    <option th:each="cat : ${categories}" 
                                            th:value="${cat.id}" 
                                            th:text="${cat.name}">Category</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">Invalid category</div>
                            </div>

                            <!-- Title -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Task Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{title}" placeholder="e.g. Practice Java coding for 1 hour" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</div>
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Description (Optional)</label>
                                <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Provide details or guidelines for this daily task..."></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</div>
                            </div>

                            <!-- Dates Row -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small">Start Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" th:field="*{startDate}" th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}">Start date error</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small">End Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" th:field="*{endDate}" th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid'" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}">End date error</div>
                                </div>
                            </div>

                            <!-- Target Frequency -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Frequency <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{targetFrequency}">
                                    <option value="DAILY">Daily (Every Day)</option>
                                    <option value="WEEKLY">Weekly</option>
                                    <option value="CUSTOM">Custom</option>
                                </select>
                            </div>

                            <!-- Active Status -->
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" th:field="*{active}" id="active">
                                <label class="form-check-label fw-bold small" for="active">
                                    Active Task (Track daily completions and include in streaks)
                                </label>
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex justify-content-end gap-2">
                                <a href="/tasks" class="btn btn-light">Cancel</a>
                                <button type="submit" class="btn btn-warning fw-bold px-4">
                                    <i class="bi bi-check-circle me-1"></i> Save Task
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
